<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence Report - Session #12</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-heading: #f0f6fc;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #1f242d 0%, #161b22 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .header h1 { margin: 0 0 12px 0; color: var(--text-heading); font-size: 24px; }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .meta-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
        }
        .meta-card .label { font-size: 12px; color: #8b949e; text-transform: uppercase; }
        .meta-card .val { font-size: 16px; font-weight: 600; color: var(--text-heading); margin-top: 4px; }
        
        .finding-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .finding-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .finding-title { font-size: 18px; font-weight: 600; color: var(--text-heading); }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-medium { background: rgba(210, 153, 34, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .badge-info { background: rgba(88, 166, 255, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        
        .finding-body { padding: 20px; }
        .summary { font-size: 15px; line-height: 1.6; margin-bottom: 20px; }

        .remediation-box {
            background: rgba(63, 185, 80, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }
        .remediation-box h4 { margin: 0 0 8px 0; color: var(--success); }

        pre {
            background: #090d11;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 OSINT Intelligence Dashboard</h1>
            <div class="meta-grid">
                <div class="meta-card">
                    <div class="label">Target Value</div>
                    <div class="val">8.8.8.8</div>
                </div>
                <div class="meta-card">
                    <div class="label">Target Type</div>
                    <div class="val">IpAddress</div>
                </div>
                <div class="meta-card">
                    <div class="label">Total Findings</div>
                    <div class="val">1</div>
                </div>
                <div class="meta-card">
                    <div class="label">Scan Status</div>
                    <div class="val" style="color: var(--success)">Completed</div>
                </div>
            </div>
        </div>

        <h2>Intelligence Findings</h2>
        <div id="findings-container"></div>
    </div>

    <script>
        const sessionData = {
  "Id": 12,
  "TargetId": 4,
  "Target": {
    "Id": 4,
    "Value": "8.8.8.8",
    "Type": 2,
    "Description": "CLI direct scan target",
    "CreatedAt": "2026-07-29T01:19:41.3130531",
    "LastScannedAt": "2026-07-29T01:53:15.8411512"
  },
  "Status": 2,
  "StartedAt": "2026-07-29T01:53:15.5500978",
  "CompletedAt": "2026-07-29T01:53:15.8411509",
  "Notes": "Scan for 8.8.8.8 [IpAddress]",
  "Results": [
    {
      "Id": 12,
      "ScanSessionId": 12,
      "ModuleName": "IpInfo",
      "Title": "IP Infrastructure Analysis: 8.8.8.8",
      "Summary": "Located IP \u00278.8.8.8\u0027 in San Jose, US (AS13335). Open web services detected on ports 80/443.",
      "RawDataJson": "{\n  \u0022GeoLocation\u0022: {\n    \u0022Ip\u0022: \u00228.8.8.8\u0022,\n    \u0022Country\u0022: \u0022United States\u0022,\n    \u0022CountryCode\u0022: \u0022US\u0022,\n    \u0022Region\u0022: \u0022California\u0022,\n    \u0022City\u0022: \u0022San Jose\u0022,\n    \u0022Latitude\u0022: 37.3382,\n    \u0022Longitude\u0022: -121.8863,\n    \u0022Isp\u0022: \u0022Cloud Infrastructure Corp\u0022,\n    \u0022Asn\u0022: \u0022AS13335\u0022,\n    \u0022Organization\u0022: \u0022Cloud Infrastructure Network\u0022\n  },\n  \u0022ExposedServices\u0022: [\n    {\n      \u0022Port\u0022: 80,\n      \u0022Service\u0022: \u0022HTTP\u0022,\n      \u0022State\u0022: \u0022Open\u0022\n    },\n    {\n      \u0022Port\u0022: 443,\n      \u0022Service\u0022: \u0022HTTPS\u0022,\n      \u0022State\u0022: \u0022Open\u0022\n    },\n    {\n      \u0022Port\u0022: 8080,\n      \u0022Service\u0022: \u0022HTTP-Proxy\u0022,\n      \u0022State\u0022: \u0022Filtered\u0022\n    }\n  ]\n}",
      "Severity": 0,
      "Timestamp": "2026-07-29T01:53:15.8411346"
    }
  ]
};
        const container = document.getElementById('findings-container');

        if (!sessionData.Results || sessionData.Results.length === 0) {
            container.innerHTML = '<p>No findings recorded in this scan session.</p>';
        } else {
            sessionData.Results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'finding-card';

                let parsedData = {};
                try { parsedData = JSON.parse(result.RawDataJson); } catch(e){}

                let remediationHtml = '';
                if (parsedData.BreachesCount && parsedData.BreachesCount > 0) {
                    remediationHtml = `
                        <div class="remediation-box">
                            <h4>🛡️ Recommended Defense Guidance</h4>
                            <ul>
                                <li>Immediately change passwords on accounts associated with this email address.</li>
                                <li>Enable Multi-Factor Authentication (MFA / 2FA) across all services.</li>
                                <li>Use an isolated, unique password generator/manager for every service.</li>
                            </ul>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="finding-header">
                        <div class="finding-title">${result.Title}</div>
                        <span class="badge badge-${(result.Severity || 'info').toLowerCase()}">${result.Severity}</span>
                    </div>
                    <div class="finding-body">
                        <div class="summary">${result.Summary}</div>
                        ${remediationHtml}
                        <h4>Structured Finding Metadata</h4>
                        <pre><code>${JSON.stringify(parsedData, null, 2)}</code></pre>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
